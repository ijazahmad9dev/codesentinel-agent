services:
  codesentinel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: codesentinel-agent
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true